<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicAI - The Future of Healthcare</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">
    <div class="min-h-screen flex flex-col items-center justify-center px-4">
        <h1 class="text-5xl font-bold mb-4 text-blue-500">ClinicAI</h1>
        <p class="text-xl mb-8 text-center max-w-lg">
            I'm 19, building the brain for every clinic in India. Join the revolution.
        </p>
        
        <!-- Waitlist Form -->
        <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-md">
            <h2 class="text-2xl mb-4">Get Early Access</h2>
            <input type="email" placeholder="Enter your email" class="w-full p-3 rounded bg-gray-700 mb-4 border border-gray-600 focus:outline-none focus:border-blue-500">
            <button class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded font-bold transition">BOOM - Join Waitlist</button>
        </div>
        
        <p class="mt-8 text-gray-500 italic">Built on a train to Bengaluru.</p>
    </div>
</body>
</html>
